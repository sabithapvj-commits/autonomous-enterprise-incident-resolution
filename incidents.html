<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI-01 | Incidents</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0b1220;
            color: #ffffff;
            min-height: 100vh;
        }

        .header {
            padding: 22px 35px;
            border-bottom: 1px solid #263248;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand h1 {
            font-size: 24px;
        }

        .brand p {
            color: #8f9bb3;
            margin-top: 5px;
            font-size: 14px;
        }

        .status {
            background: #12351f;
            color: #5ee68a;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
        }

        .container {
            padding: 35px;
        }

        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .top-section h2 {
            font-size: 26px;
        }

        .refresh-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
        }

        .refresh-btn:hover {
            background: #1d4ed8;
        }

        .table-card {
            background: #111a2b;
            border: 1px solid #263248;
            border-radius: 12px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #172238;
            color: #9eabc2;
            text-align: left;
            padding: 16px;
            font-size: 13px;
        }

        td {
            padding: 17px 16px;
            border-top: 1px solid #263248;
            font-size: 14px;
        }

        tr:hover {
            background: #151f32;
        }

        .incident-code {
            color: #60a5fa;
            font-weight: bold;
        }

        .severity-high {
            color: #ff6b6b;
            font-weight: bold;
        }

        .severity-medium {
            color: #f6c85f;
            font-weight: bold;
        }

        .severity-low {
            color: #5ee68a;
            font-weight: bold;
        }

        .status-open {
            color: #ffb86b;
            font-weight: bold;
        }

        .status-resolved {
            color: #5ee68a;
            font-weight: bold;
        }

        .view-btn {
            background: transparent;
            color: #60a5fa;
            border: 1px solid #60a5fa;
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .view-btn:hover {
            background: #60a5fa;
            color: #08111f;
        }

        .message {
            padding: 25px;
            text-align: center;
            color: #8f9bb3;
        }

        @media (max-width: 900px) {
            .container {
                padding: 20px;
                overflow-x: auto;
            }

            .table-card {
                min-width: 850px;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="brand">
            <h1>AI-01 Incident Resolution Engine</h1>
            <p>Autonomous Enterprise Incident Management</p>
        </div>

        <div class="status">
            ● System Online
        </div>
    </header>

    <main class="container">

        <div class="top-section">
            <h2>Incidents</h2>

            <button class="refresh-btn" onclick="loadIncidents()">
                Refresh
            </button>
        </div>

        <div class="table-card">

            <table>
                <thead>
                    <tr>
                        <th>Incident</th>
                        <th>Title</th>
                        <th>Severity</th>
                        <th>Business Impact</th>
                        <th>Status</th>
                        <th>Created</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="incidentTableBody">
                    <tr>
                        <td colspan="7" class="message">
                            Loading incidents...
                        </td>
                    </tr>
                </tbody>
            </table>

        </div>

    </main>

    <script>

        const API = "http://localhost:3000";

        async function loadIncidents() {

            const tableBody =
                document.getElementById("incidentTableBody");

            tableBody.innerHTML = `
                <tr>
                    <td colspan="7" class="message">
                        Loading incidents...
                    </td>
                </tr>
            `;

            try {

                const response =
                    await fetch(`${API}/api/incidents`);

                const data =
                    await response.json();

                if (!data.success || data.incidents.length === 0) {

                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="7" class="message">
                                No incidents found.
                            </td>
                        </tr>
                    `;

                    return;
                }

                tableBody.innerHTML = "";

                data.incidents.forEach(incident => {

                    let severityClass =
                        "severity-medium";

                    if (incident.severity === "HIGH") {
                        severityClass = "severity-high";
                    }

                    if (incident.severity === "LOW") {
                        severityClass = "severity-low";
                    }

                    let statusClass =
                        incident.status === "RESOLVED"
                            ? "status-resolved"
                            : "status-open";

                    const createdDate =
                        new Date(incident.created_at)
                            .toLocaleString();

                    const row = document.createElement("tr");

                    row.innerHTML = `
                        <td>
                            <span class="incident-code">
                                ${incident.incident_code}
                            </span>
                        </td>

                        <td>
                            ${incident.title}
                        </td>

                        <td>
                            <span class="${severityClass}">
                                ${incident.severity}
                            </span>
                        </td>

                        <td>
                            ${incident.business_impact || "Not assessed"}
                        </td>

                        <td>
                            <span class="${statusClass}">
                                ${incident.status}
                            </span>
                        </td>

                        <td>
                            ${createdDate}
                        </td>

                        <td>
                            <button
                                class="view-btn"
                                onclick="viewIncident(${incident.id})">
                                View Details
                            </button>
                        </td>
                    `;

                    tableBody.appendChild(row);

                });

            } catch (error) {

                console.error(error);

                tableBody.innerHTML = `
                    <tr>
                        <td colspan="7" class="message">
                            Unable to connect to AI-01 backend.
                        </td>
                    </tr>
                `;
            }
        }


        function viewIncident(id) {

            window.location.href =
                `incident.html?id=${id}`;

        }


        loadIncidents();

    </script>

</body>
</html>
